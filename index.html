<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проекты Marvel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <button id="menu-toggle" class="header-icon">☰</button>
        <div id="search-container" class="search-container">
             <input type="text" id="search-input" placeholder="Поиск...">
        </div>
        <div class="header-controls">
            <button id="search-toggle" class="header-icon">🔍</button>
            <button id="theme-toggle" class="header-icon">☀️</button>
        </div>
    </header>

    <nav id="nav-menu">
        <button id="close-menu-btn">×</button>
        <h3>Навигация</h3>
        <ul id="nav-links">
            </ul>
    </nav>
    <div id="overlay"></div> <main id="project-list">
        </main>

    <div id="project-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">×</span>
            <h2 id="modal-title">Название проекта</h2>
            <p><strong>Дата выхода:</strong> <span id="modal-release-date"></span></p>
            <p><strong>Продолжительность:</strong> <span id="modal-duration"></span></p>
            <p><strong>Режиссёр(ы):</strong> <span id="modal-director"></span></p>
            <p><strong>Озвучка:</strong> <span id="modal-voice-over"></span></p>
            <p><strong>Рейтинги:</strong> IMDb: <span id="modal-imdb"></span> / Кинопоиск: <span id="modal-kinopoisk"></span></p>
            <div id="modal-link-container">
                <p><strong>Ссылка:</strong> <span id="modal-link"></span></p>
                 <small class="disclaimer" id="modal-link-disclaimer" style="display: none;">(Внимание: ссылки на некоторые ресурсы могут вести на неофициально размещенный контент)</small>
            </div>
            <div id="modal-notes"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
